<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-label="Vectorless RAG flow diagram">
  <rect width="1400" height="360" fill="#f6f8fc"/>
  <text x="60" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#10243e">Vectorless RAG Pipeline</text>
  <text x="60" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#49627f">Transparent retrieval without embeddings or a vector database.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="146" width="190" height="110" rx="20" fill="#10243e"/>
    <text x="96" y="195" font-size="22" font-weight="700" fill="#ffffff">Report File</text>
    <text x="95" y="225" font-size="16" fill="#d9e7fb">PDF or HTML</text>

    <rect x="310" y="146" width="210" height="110" rx="20" fill="#ffffff" stroke="#cfd9e6"/>
    <text x="360" y="195" font-size="22" font-weight="700" fill="#10243e">Parser</text>
    <text x="334" y="225" font-size="16" fill="#49627f">Clean plain text extraction</text>

    <rect x="580" y="146" width="220" height="110" rx="20" fill="#ffffff" stroke="#cfd9e6"/>
    <text x="610" y="195" font-size="22" font-weight="700" fill="#10243e">Section Splitter</text>
    <text x="616" y="225" font-size="16" fill="#49627f">Named report buckets</text>

    <rect x="860" y="146" width="220" height="110" rx="20" fill="#ffffff" stroke="#cfd9e6"/>
    <text x="895" y="195" font-size="22" font-weight="700" fill="#10243e">Retriever</text>
    <text x="886" y="225" font-size="16" fill="#49627f">Rule-based relevance scoring</text>

    <rect x="1140" y="146" width="200" height="110" rx="20" fill="#1d4d7a"/>
    <text x="1209" y="195" font-size="22" font-weight="700" fill="#ffffff">Gemini</text>
    <text x="1172" y="225" font-size="16" fill="#d9e7fb">Risk analysis output</text>
  </g>

  <g stroke="#6f8aa8" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M250 201 H290"/>
    <path d="M520 201 H560"/>
    <path d="M800 201 H840"/>
    <path d="M1080 201 H1120"/>
  </g>
</svg>
